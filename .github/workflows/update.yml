name: update data and publish

# What is live on GitHub Pages = the latest GitHub Release's code (its
# dashboards, scripts and pinned anofox-visualization) + the newest data
# snapshot on main. Unreleased commits on main never go live.
#
#   daily / manual   fetch the metrics on main, check main's dashboards on
#                    them, commit the snapshot when it changed, then build
#                    and deploy the latest release with that data
#   release          deploy the just-published release with main's current
#                    snapshot (no fetch)
#
# The release is built in its own worktree with its own tools, and its own
# strict check and smoke test run on the data first. A failing fetch, check
# or build stops the run before anything is committed or deployed, so the
# live site keeps the last good version. A release event runs this file
# from the tagged commit: tags made before this workflow existed don't
# deploy on release (use a manual run).
on:
  schedule:
    - cron: '30 6 * * *'   # the site publishes weekly, around 04:00 UTC
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write   # commit the refreshed snapshot
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # main: the data snapshot (and, on a schedule or a manual run, the
      # fetch pipeline); fetch-depth 0 for the release tags.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Which release to publish
        id: release
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="$(gh release list --exclude-drafts --exclude-pre-releases -L 1 --json tagName -q '.[0].tagName')"
          fi
          [ -n "$TAG" ] || { echo "no published release to deploy" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publishing $TAG with main's data ($(git rev-parse --short HEAD))"

      - name: DuckDB CLI (the version main's blueprint.json pins)
        run: |
          V="$(python3 -c 'import json; print(json.load(open("extension-downloads/blueprint.json"))["duckdb"])')"
          mkdir -p "$HOME/bin/main"
          curl -fsSL -o duckdb.zip "https://github.com/duckdb/duckdb/releases/download/$V/duckdb_cli-linux-amd64.zip"
          unzip -q -o duckdb.zip -d "$HOME/bin/main"
          echo "$HOME/bin/main" >> "$GITHUB_PATH"
          pip install --quiet pyyaml

      - name: anofox-visualization tools for main (pinned release, checksums verified)
        if: github.event_name != 'release'
        run: scripts/fetch-tools.sh --blueprint extension-downloads

      - name: Fetch the latest metrics into the snapshot (incl. spike correction)
        if: github.event_name != 'release'
        run: extension-downloads/scripts/fetch.sh --out extension-downloads/demo

      - name: main's dashboards on the fresh data (strict check, locked-server smoke)
        if: github.event_name != 'release'
        run: extension-downloads/scripts/ci.sh

      - name: Commit the snapshot if it changed
        if: github.event_name != 'release'
        run: |
          # meta.json's fetched_at changes on every run: commit only when a
          # data file changed (meta.json then goes along with it). The
          # GitHub-stars history (stars.parquet) gains a day on every run,
          # so in practice this commits daily.
          if git diff --quiet -- extension-downloads/demo ':!extension-downloads/demo/meta.json'; then
            git checkout -- extension-downloads/demo/meta.json
            echo "no new data"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add extension-downloads/demo
            git commit -m "data: snapshot $(python3 -c 'import json; m=json.load(open("extension-downloads/demo/meta.json")); print(m["last_week"], "fetched", m["fetched_at"])')"
            git push
          fi

      - name: The release's code with main's data (worktree)
        run: |
          git worktree add --detach "$RUNNER_TEMP/release" "${{ steps.release.outputs.tag }}"
          cp -f extension-downloads/demo/* "$RUNNER_TEMP/release/extension-downloads/demo/"

      - name: DuckDB CLI (the version the release pins)
        working-directory: ${{ runner.temp }}/release
        run: |
          V="$(python3 -c 'import json; print(json.load(open("extension-downloads/blueprint.json"))["duckdb"])')"
          mkdir -p "$HOME/bin/release"
          curl -fsSL -o "$RUNNER_TEMP/duckdb-release.zip" "https://github.com/duckdb/duckdb/releases/download/$V/duckdb_cli-linux-amd64.zip"
          unzip -q -o "$RUNNER_TEMP/duckdb-release.zip" -d "$HOME/bin/release"
          echo "DUCKDB=$HOME/bin/release/duckdb" >> "$GITHUB_ENV"

      - name: The release's tools, then its dashboards on the data (strict check, locked-server smoke)
        working-directory: ${{ runner.temp }}/release
        run: |
          scripts/fetch-tools.sh --blueprint extension-downloads
          PATH="$HOME/bin/release:$PATH" extension-downloads/scripts/ci.sh

      - name: Build the site (the release's dashboard --site, its dashboards and the data)
        working-directory: ${{ runner.temp }}/release
        run: PATH="$HOME/bin/release:$PATH" scripts/build-site.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/release/site
      - id: deploy
        uses: actions/deploy-pages@v4
