name: update data and publish

# Daily: fetch DuckDB's community-extension download metrics, check every
# dashboard on the fresh data, commit the snapshot when it changed, and
# publish the static site to GitHub Pages. A failing fetch or check stops the
# run before anything is committed or deployed, so the live site keeps the
# last good data.
on:
  schedule:
    - cron: '30 6 * * *'   # the site publishes weekly, around 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed snapshot
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: DuckDB CLI (the version blueprint.json pins)
        run: |
          V="$(python3 -c 'import json; print(json.load(open("extension-downloads/blueprint.json"))["duckdb"])')"
          mkdir -p "$HOME/bin"
          curl -fsSL -o duckdb.zip "https://github.com/duckdb/duckdb/releases/download/$V/duckdb_cli-linux-amd64.zip"
          unzip -q duckdb.zip -d "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          pip install --quiet pyyaml

      - name: anofox-visualization tools (pinned release, checksums verified)
        run: scripts/fetch-tools.sh --blueprint extension-downloads

      - name: Fetch the latest metrics into the snapshot (incl. spike correction)
        env:
          GH_TOKEN: ${{ github.token }}
        run: extension-downloads/scripts/fetch.sh --out extension-downloads/demo

      - name: Every dashboard on the fresh data (strict check, locked-server smoke)
        run: extension-downloads/scripts/ci.sh

      - name: Commit the snapshot if it changed
        run: |
          if git diff --quiet -- extension-downloads/demo; then
            echo "no new data"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add extension-downloads/demo
            git commit -m "data: snapshot $(python3 -c 'import json; m=json.load(open("extension-downloads/demo/meta.json")); print(m["last_week"], "fetched", m["fetched_at"])')"
            git push
          fi

      - name: anofox-visualization web app source (the pinned tag)
        run: |
          V="$(python3 -c 'import json; print(json.load(open("extension-downloads/blueprint.json"))["anofox_visualization"])')"
          git clone -q --depth 1 --branch "$V" https://github.com/DataZooDE/anofox-visualization.git .cache/avz

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .cache/avz

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build the app (DuckDB-Wasm + anofox-visualization wasm, as upstream's Pages build does)
        working-directory: .cache/avz
        run: wasm-pack build --target web --out-dir web/pkg --profile wasm --no-default-features --features wasm

      - name: Build the site (the app, our dashboards, the data)
        run: python3 site-tools/build-site.py --app .cache/avz/web --data extension-downloads/data --out site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
