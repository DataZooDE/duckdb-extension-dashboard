name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['extension-downloads/demo/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DuckDB CLI (the version blueprint.json pins)
        run: |
          V="$(python3 -c 'import json; print(json.load(open("extension-downloads/blueprint.json"))["duckdb"])')"
          mkdir -p "$HOME/bin"
          curl -fsSL -o duckdb.zip "https://github.com/duckdb/duckdb/releases/download/$V/duckdb_cli-linux-amd64.zip"
          unzip -q duckdb.zip -d "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: anofox-visualization tools (pinned release, checksums verified)
        run: scripts/fetch-tools.sh --blueprint extension-downloads

      - name: Dashboards on the committed snapshot (strict check, locked-server smoke)
        run: extension-downloads/scripts/ci.sh

      - name: anofox-visualization web app source (the pinned tag)
        run: |
          V="$(python3 -c 'import json; print(json.load(open("extension-downloads/blueprint.json"))["anofox_visualization"])')"
          git clone -q --depth 1 --branch "$V" https://github.com/DataZooDE/anofox-visualization.git .cache/avz

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .cache/avz

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build the app (DuckDB-Wasm + anofox-visualization wasm, as upstream's Pages build does)
        working-directory: .cache/avz
        run: wasm-pack build --target web --out-dir web/pkg --profile wasm --no-default-features --features wasm

      - name: Build the site (the app, our dashboards, the data)
        run: python3 site-tools/build-site.py --app .cache/avz/web --data extension-downloads/data --out site
